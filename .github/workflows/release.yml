name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-latest
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Test
        run: go test ./...
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          ./scripts/package_app.sh
          ditto -c -k --sequesterRsrc --keepParent dist/AirLLM.app dist/AirLLM-macos-arm64.zip
      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H windowsgui" -o dist/AirLLM.exe ./cmd/airllm-desktop
          Compress-Archive -Path dist/AirLLM.exe -DestinationPath dist/AirLLM-windows-amd64.zip -Force
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          go build -o dist/airllm-desktop ./cmd/airllm-desktop
          tar -C dist -czf dist/AirLLM-linux-amd64.tar.gz airllm-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: AirLLM-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" release-files/* --generate-notes --title "AirLLM ${{ github.ref_name }}"
